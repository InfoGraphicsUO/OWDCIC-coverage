<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>OWDCIC Camera Coverage</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
        <link rel="icon" href="img/OHAZ-logo.png" type="image/png">

        <!-- mapboxgl global must exist before js/map.js initializes the map -->
        <link href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css" rel="stylesheet">
        <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
        <script defer src="https://kit.fontawesome.com/be4ea184d4.js" crossorigin="anonymous"></script>
        
        <link rel="stylesheet" href="css/site.css">
        <link rel="stylesheet" href="css/map.css">
        <link rel="stylesheet" href="css/legend.css">
        <link rel="stylesheet" href="css/popups.css">
        <link rel="stylesheet" href="css/loading.css">

        <script type="module" src="js/map-layers.js"></script>
    </head>
    <body>
        <header class="site-banner">
            <img class="site-banner__logo" src="img/OHAZ-logo.png" alt="OHAZ">
            <h1 class="site-banner__title">OWDCIC Camera Coverage Map</h1>
        </header>
        <main aria-busy="true">
            <div id="map" role="region" aria-label="Oregon and Washington wildfire camera map"></div>
            <div class="map-panels">
                <output id="zoom-viewer" class="zoom-viewer" aria-label="Current map zoom">zoom: 5.4</output>
                <aside id="legend" class="legend" aria-label="Map layers"></aside>
                <div
                    id="basemap-picker"
                    class="basemap-picker"
                    role="radiogroup"
                    aria-label="Basemap"
                >
                    <label class="basemap-picker__option">
                        <input type="radio" name="basemap" value="outdoors" checked>
                        <span>Default</span>
                    </label>
                    <label class="basemap-picker__option">
                        <input type="radio" name="basemap" value="satellite">
                        <span>Satellite</span>
                    </label>
                </div>
            </div>
        </main>
        <div id="map-loading" class="map-loading" role="status" aria-live="polite">
            <div class="map-loading__content">
                <span class="map-loading__spinner" aria-hidden="true"></span>
                <span>Loading map data...</span>
            </div>
        </div>
    </body>
</html>
