<!-- map marker for ALERTWest sites kept out of the API for landowner privacy (#147); the slash marks a camera with no public imagery; no width or height so js/marker-icons.js can rasterize it at any density -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Private camera">
  <rect x="1" y="1" width="22" height="22" rx="3.5" fill="#000000"/>
  <rect x="2.5" y="2.5" width="19" height="19" rx="2.5" fill="#f2b705"/>
  <rect x="8" y="5" width="5" height="4" rx="1" fill="#000000"/>
  <rect x="5" y="8" width="14" height="11" rx="2" fill="#000000"/>
  <circle cx="12" cy="14" r="3.25" fill="#f2b705"/>
  <line x1="4.2" y1="4.2" x2="19.8" y2="19.8" stroke="#f2b705" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="4.2" y1="4.2" x2="19.8" y2="19.8" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
</svg>
