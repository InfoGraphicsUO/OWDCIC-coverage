<!-- the banner's viewshed rings (img/viewshed-rings.svg) as a small pulse icon; drawn in black so it can be used as a css mask and take any color, e.g. the coverage report tab in css/map.css -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="200" height="200" fill="none" stroke="#000" stroke-width="17">
  <circle r="90" stroke-opacity="0.35"/>
  <circle r="60" stroke-opacity="0.6"/>
  <circle r="31" stroke-opacity="0.9"/>
  <circle r="13" fill="#000" stroke="none"/>
</svg>
