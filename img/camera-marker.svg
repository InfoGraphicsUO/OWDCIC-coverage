  <rect x="2.5" y="2.5" width="19" height="19" rx="2.5" fill="#f2b705"/>
  <rect x="8" y="5" width="5" height="4" rx="1" fill="#000000"/>
  <rect x="5" y="8" width="14" height="11" rx="2" fill="#000000"/>
  <circle cx="12" cy="14" r="3.25" fill="#f2b705"/>
</svg>
